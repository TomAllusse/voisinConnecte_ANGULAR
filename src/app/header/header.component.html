<header>
  <nav class="navbar">
    <div class="navbar-container">

      <!-- LOGO -->
      <a class="navbar-logo" routerLink="/home">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Voisins <strong>Connectés</strong></span>
      </a>

      <!-- LIENS -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a routerLink="/home" routerLinkActive="active"> Accueil</a>">
        </li>
        <li class="nav-item">
          <a routerLink="/annonces" routerLinkActive="active">
            Annonces
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a routerLink="/tableau" routerLinkActive="active">
            Mon tableau
          </a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a routerLink="/admin" routerLinkActive="active">
            Admin
          </a>
        </li>
      </ul>

      <!-- DROITE : profil + bouton -->
      <div class="navbar-right">
        <a *ngIf="isLoggedIn" routerLink="/profil" class="navbar-avatar" routerLinkActive="active">
          <img *ngIf="avatarUrl" [src]="avatarUrl" alt="profil" />
          <span *ngIf="!avatarUrl" class="avatar-placeholder">{{ initiales }}</span>
        </a>
        <button class="btn-auth" type="button" (click)="onAuthClick()">
          {{ authLabel }}
        </button>
      </div>

    </div>
  </nav>
</header>

<div class="page-content">
  <router-outlet></router-outlet>
</div>
