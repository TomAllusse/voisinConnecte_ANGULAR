<div class="parent">
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <input type="text" [(ngModel)]="loginObj.login" name="Identifiant" required>
                    <label>Identifiant</label>
                </div>
                <div class="input-box">
                    <input type="password" [(ngModel)]="loginObj.password" name="Password" required>
                    <label>Password</label>
                </div>
                
                <button type="button" class="btn" (click)="onLogin()" >Login</button>
                 <p>{{ this.msg }}</p>
            </form>
        </div>
    </div>
</div>
