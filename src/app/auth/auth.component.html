<div class="auth-wrapper">

  <!-- INSCRIPTION -->
  <div class="card">
    <h2 class="card-title">INSCRIPTION</h2>

    <div class="registre">
      <div class="row">
        <div class="field half">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="registerData.first_name" name="Prenom" required />
        </div>
        <div class="field half">
          <label>Nom</label>
          <input type="text" [(ngModel)]="registerData.last_name" name="Nom" required />
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="registerData.email" name="Email" required />
      </div>

      <div class="field">
        <label>Ville</label>
        <input type="text" [(ngModel)]="registerData.city" name="Ville" required />
      </div>

      <div class="field">
        <label>Choisissez votre mot de passe</label>
        <input type="password" [(ngModel)]="registerData.password" name="Password" required />
      </div>

      <div class="field">
        <label>Confirmer votre mot de passe</label>
        <input type="password" [(ngModel)]="confirmPassword" name="ConfirmPassword" required />
      </div>
    </div>

    <div class="msg-container">
      <p class="msg" *ngIf="feedbackMsg">{{ feedbackMsg }}</p>
    </div>

    <button class="btn" type="button" (click)="onRegister()">Inscription</button>
  </div>

  <!-- CONNEXION -->
  <div class="card">
    <h2 class="card-title">CONNEXION</h2>

    <div class="connexion">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="loginData.email" name="Identifiant" required />
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="loginData.password" name="Password" required />
      </div>
    </div>

    <div class="msg-container">
      <p class="msg" *ngIf="feedbackMsg">{{ feedbackMsg }}</p>
    </div>

    <button class="btn" type="button" (click)="onLogin()">Connexion</button>
  </div>

</div>
